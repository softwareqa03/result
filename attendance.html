<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        import { getDatabase, ref, child, get } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyALJ8xG21RcevPI2Le_3tohfu-M2gW8szc",
            authDomain: "pm-patel-high-school.firebaseapp.com",
            databaseURL: "https://pm-patel-high-school-default-rtdb.firebaseio.com",
            projectId: "pm-patel-high-school",
            storageBucket: "pm-patel-high-school.appspot.com",
            messagingSenderId: "334539397246",
            appId: "1:334539397246:web:8c6a67a82e2380f9a6202f"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                const dbRef = ref(db);
                get(child(dbRef, `attendance/${user.uid}`)).then((snapshot) => {
                    if (snapshot.exists()) {
                        const data = snapshot.val();
                        document.getElementById("attendanceSection").innerHTML = `
                            <h2>Attendance Record</h2>
                            <p>Date: ${data.date}</p>
                            <p>Status: ${data.status}</p>
                        `;
                    } else {
                        document.getElementById("attendanceSection").innerHTML = '<p>No attendance record found.</p>';
                    }
                });
            } else {
                window.location.href = 'login.html';
            }
        });
    </script>
</head>
<body class="bg-gray-100">
    <header class="bg-blue-500 text-white p-4">
        <h1 class="text-xl">Attendance Page</h1>
    </header>
    <main class="p-4">
        <div id="attendanceSection" class="bg-white p-4 rounded shadow">
            <!-- Attendance data will be displayed here -->
        </div>
    </main>
    <footer class="bg-blue-500 text-white p-4 text-center">
        © 2025 Shri P. M. Patel High School
    </footer>
</body>
</html>
